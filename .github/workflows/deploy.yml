name: Build and Push
on:
  push:
    branches: [main]
    paths: ['static/**', 'Dockerfile', '.github/workflows/deploy.yml']
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Determine version
        id: version
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="1.0.0"
          else
            CLEAN_TAG=${LAST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            PATCH=$((PATCH + 1))
            NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_TAG}"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.tag }}" -m "Release v${{ steps.version.outputs.tag }}"
          git push origin "v${{ steps.version.outputs.tag }}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: '${{ steps.meta.outputs.tags }}', no-cache: true}

      - name: Update ArgoCD manifest
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        if: env.GH_PAT != ''
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/mctlhq/mctl-core.git /tmp/mctl-core
          cd /tmp/mctl-core
          VALUES_FILE="platform-gitops/services/preview/admin/mctl-web/values.yaml"
          if [ -f "$VALUES_FILE" ]; then
            sed -i "s|tag:.*|tag: ${{ steps.version.outputs.tag }}|" "$VALUES_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$VALUES_FILE"
            git commit -m "deploy: admin/mctl-web → ${{ steps.version.outputs.tag }}" || true
            git push
          fi
          rm -rf /tmp/mctl-core
