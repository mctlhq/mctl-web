name: security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "57 4 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.3
          # Fails on fixable HIGH/CRITICAL findings; ignore-unfixed skips CVEs with no upstream fix.
