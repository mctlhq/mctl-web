name: Deploy on tag

# Pushing a semver tag (e.g. 6.1.0, no v-prefix) ships the static site to
# mctl.ai: build the image from the tag and roll it out via the centralized
# mctl-gitops release-deploy pipeline (ArgoCD auto-syncs the bumped image tag).
# This makes the documented "tag -> deploy" workflow actually work; previously
# release-deploy had to be dispatched by hand in mctl-gitops.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# Serialize deploys: the gitops image.tag bump is a single-writer commit to
# mctl-gitops main, so overlapping dispatches must not race.
concurrency:
  group: deploy-mctl-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Note: `gh workflow run` is fire-and-forget — this step goes green once
      # the dispatch is accepted, not when release-deploy actually succeeds.
      # Watch the run in mctl-gitops Actions to confirm the build/bump landed.
      - name: Dispatch centralized release-deploy
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-web \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-web \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-web
