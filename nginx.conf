server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The container listens on plain 80 behind Cloudflare's TLS. With nginx's
    # default absolute_redirect, the trailing-slash redirect try_files emits for
    # a directory (/docs -> /docs/) is built from that listen port and goes out
    # as `http://mctl.ai/docs/`, which Cloudflare then bounces back to https.
    # Google saw a two-hop, protocol-downgrading chain and filed every such URL
    # under "Page with redirect". A relative Location keeps the scheme intact.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://api.github.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com;" always;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health checks
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /readyz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Nuxt generated assets — immutable, 1 year cache.
    # add_header in a location replaces server-level add_header, so repeat
    # the security headers here or HTML/assets ship with no CSP.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://api.github.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Images — moderate cache (revalidate on deploy)
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://api.github.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Every route is prerendered, so anything else is genuinely missing. Falling
    # back to the homepage answered unknown URLs with 200 and the full landing
    # page, which Google indexes as a Soft 404 and as duplicate content.
    # no-store prevents CF and browsers from caching HTML so chunk hashes stay fresh
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://api.github.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ =404;
    }

    # Nitro emits 200.html as an SPA fallback shell. nginx no longer uses it
    # (see the location / block), but it stays in the output directory and was
    # reachable as a canonical-less copy of the homepage.
    location = /200.html {
        return 404;
    }

    error_page 404 /404.html;

    # add_header in a location replaces server-level add_header, so the error
    # page repeats them like every other location above.
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://api.github.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com;" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
