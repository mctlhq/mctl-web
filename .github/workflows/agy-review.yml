name: Agy PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  agy-review:
    uses: mctlhq/.github/.github/workflows/agy-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      conventions: |
        Focus on: Nuxt 3 Vue SSR/hydration safety, Cloudflare Worker route handling and security in `cloudflare-worker/`, custom i18n key completeness in `app/composables/useI18n.ts`, nginx routing & security headers (`nginx.conf`), responsive web UI/a11y, and design token consistency.
