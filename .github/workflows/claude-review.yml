name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@aca5e626d3066bde2b408697b8667ed6bf4eb51d
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot"
      conventions: |
        Follow the conventions in this repository's CLAUDE.md (TypeScript/
        Cloudflare Worker, conventional commits, English only, no emoji).

        Focus on:
        - Correctness and logic errors; edge cases the change misses.
        - Security: XSS, CSRF, OAuth token handling, secret leakage in
          client-side code or Worker responses.
        - Cloudflare Worker constraints: no Node.js APIs, CPU time limits,
          correct use of the Cache API and KV.
        - Error handling: ignored errors, missing fallbacks.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
