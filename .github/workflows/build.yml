
name: build

# No paths-ignore on the trigger, deliberately.
#
# `build` is a required status check on main. A required check whose workflow
# is path-filtered does not run at all on the PRs it excludes, and an absent
# check is not "pending then green" — it never arrives, so the PR sits at
# BLOCKED with mergeable=MERGEABLE and reviewDecision=APPROVED indefinitely.
# The only way out is an admin override, which is how #88 had to be merged.
#
# So the job always starts and always reports the context; the expensive work
# is skipped instead. Worker-only PRs get a green `build` in seconds without a
# Docker build that would prove nothing about them.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed for the diff below: the default shallow fetch has no merge
          # base to compare against.
          fetch-depth: 0

      # The required check validates its own decision logic before acting on
      # it. This runs in milliseconds and is the reason the logic lives in a
      # script rather than inline: two defects shipped in six lines of YAML
      # shell that no test could reach.
      - name: Test the scope decision logic
        run: bash .github/scripts/build-needed.test.sh

      - name: Decide whether anything outside the Worker changed
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Fails loudly rather than silently building or silently skipping if
          # the base ref cannot be resolved.
          git rev-parse --verify "origin/${BASE_REF}" >/dev/null

          # core.quotePath=false keeps non-ASCII paths literal. With the default
          # on, git renders them as "cloudflare-worker/r\303\251sum\303\251.txt"
          # — leading quote included — so a worker file stops matching the
          # prefix and drags in a build it does not need.
          changed=$(git -c core.quotePath=false diff --name-only "origin/${BASE_REF}...HEAD")
          echo "changed files:"
          printf '%s\n' "${changed:-<none>}"

          needed=$(printf '%s' "${changed}" | bash .github/scripts/build-needed.sh)
          echo "needed=${needed}" >> "$GITHUB_OUTPUT"
          if [ "${needed}" = "false" ]; then
            echo "Only cloudflare-worker/** changed — skipping the image build."
            echo "The Worker is covered by worker-test; this job builds the Nuxt site."
          fi

      - name: Docker meta
        if: steps.scope.outputs.needed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mctlhq/mctl-web
          tags: |
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        if: steps.scope.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build (PR validation — no push)
        if: steps.scope.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=pr-${{ github.event.pull_request.number }}

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ *mctl-web PR build failed*
            PR: `${{ github.head_ref }}` → `${{ github.base_ref }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
