server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health checks
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /readyz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }
}
