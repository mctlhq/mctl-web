name: worker-test

on:
  pull_request:
    branches: [main]
    paths: ['cloudflare-worker/**', '.github/workflows/worker-test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run worker OAuth tests
        run: node --test cloudflare-worker/oauth.test.mjs
