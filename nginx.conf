server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health checks
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /readyz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Static assets - short cache for JS/CSS (cache-busted via ?v=)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    # Images - long cache (stable assets)
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }
}
