name = "mctl-landing-form"
main = "index.js"
compatibility_date = "2024-01-01"

# Environment variables (set via Cloudflare dashboard or wrangler secret)
# TELEGRAM_BOT_TOKEN = "your-bot-token-here"
# TELEGRAM_CHAT_ID = "your-chat-id-here"

# Non-secret config vars — plain values, safe to keep in git.
[vars]
# GitHub logins exempt from tenant-provisioning limits, comma-separated.
UNLIMITED_USERS = "mashkovd"

# Routes:
#   mctl.ai/api/*      — primary API endpoint
#   mctl.me/*          — redirect root domain to mctl.ai
#   *.mctl.me/*        — redirect subdomains to *.mctl.ai
#   mctl.ru/*          — redirect root domain to mctl.ai
#   *.mctl.ru/*        — redirect subdomains to *.mctl.ai
routes = [
  { pattern = "mctl.ai/api/*",  zone_name = "mctl.ai" },
  { pattern = "mctl.me/*",      zone_name = "mctl.me" },
  { pattern = "*.mctl.me/*",    zone_name = "mctl.me" },
  { pattern = "mctl.ru/*",      zone_name = "mctl.ru" },
  { pattern = "*.mctl.ru/*",    zone_name = "mctl.ru" }
]
