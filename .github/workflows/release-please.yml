name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: deploy-mctl-web
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Note: `gh workflow run` is fire-and-forget — this step goes green once
      # the dispatch is accepted, not when release-deploy actually succeeds.
      # Watch the run in mctl-gitops Actions to confirm the build/bump landed.
      - name: Dispatch centralized release-deploy
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-web \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-web \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-web
