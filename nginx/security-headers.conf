# Static security headers, shared by every location in nginx.conf.
#
# nginx's add_header is inherited from the enclosing level ONLY when the
# current level declares none of its own. A location that sets Cache-Control
# therefore drops every server-level header. Each location that sets any
# header must include this file (and csp-report-only.conf) itself;
# scripts/nginx-includes.test.mjs fails the build when one does not.
#
# The enforcing Content-Security-Policy below is also the source of truth for
# the Report-Only policy: scripts/csp-report-only.mjs derives the stricter
# policy from this exact value, so the two cannot drift on host allowlists.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://stats.mctl.ai https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://ui.mctl.ai; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://ui.mctl.ai https://avatars.githubusercontent.com; connect-src 'self' https://mctl.ai https://stats.mctl.ai https://api.github.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
