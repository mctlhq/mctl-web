name = "mctl-landing-form"
main = "index.js"
compatibility_date = "2024-01-01"

# Environment variables (set via Cloudflare dashboard or wrangler secret)
# TELEGRAM_BOT_TOKEN = "your-bot-token-here"
# TELEGRAM_CHAT_ID = "your-chat-id-here"

# Routes are NOT declared here. The five route objects of this worker are
# owned by OpenTofu in mctlhq/mctl-gitops (infrastructure/cloudflare/zones/
# mctl-ai|mctl-me|mctl-ru/workers.tf, mctlhq/mctl-gitops#1179):
#   mctl.ai/api/*, mctl.me/*, *.mctl.me/*, mctl.ru/*, *.mctl.ru/*
# Do not add a `routes` (or `route`) key back: `wrangler deploy` publishes
# routes with PUT /workers/scripts/<name>/routes, which replaces every route of
# the script and would overwrite the ones OpenTofu owns. Change a pattern in
# mctl-gitops instead; the worker code here still decides what each pattern
# does. This file keeps the script, its [vars], and (via `wrangler secret`)
# its secrets.

# With no routes, wrangler would otherwise default workers_dev to true and
# preview_urls to unset. Both are stated explicitly, equal to the live values
# read on 2026-09-25 (enabled: true, previews_enabled: true), so removing the
# routes changes nothing on the next deploy.
workers_dev = true
preview_urls = true

# Workers Logs (C1b). Until 2026-10-16 the script kept no logs at all, so the
# first live ZITADEL sign-in could only be reconstructed from zone analytics
# and the KV namespace. The log lines are the console.* calls in index.js and
# zitadel.js: status codes, refusal codes, GitHub numeric ids and team names,
# never tokens, cookies or session ids. Cloudflare keeps them for the plan's
# retention window.
[observability]
enabled = true
head_sampling_rate = 1

# Non-secret config vars — plain values, safe to keep in git.
[vars]
# GitHub logins exempt from tenant-provisioning limits, comma-separated.
UNLIMITED_USERS = "mashkovd"

# ZITADEL sign-in for the site (stage C1a, docs/plans/site-onboarding-review.md).
# mctl-web is a public PKCE client in the customers org: no client secret.
# Who may use the cookie flow before AUTH_FLOW_PUBLIC is "true" comes from the
# secret AUTH_FLOW_TEST_GITHUB_IDS (numeric GitHub ids, comma-separated); while
# it is unset, every signed-in visitor gets 403 on /api/team/check and the
# cookie branch of /api/submit.
ZITADEL_ISSUER = "https://auth.mctl.ai"
ZITADEL_CLIENT_ID = "395272531977766613"
ZITADEL_ORG_ID = "395272528420931285"
ZITADEL_GITHUB_IDP_ID = "395272531877168853"
ZITADEL_REDIRECT_URI = "https://mctl.ai/api/zitadel/callback"
ZITADEL_POST_LOGOUT_URI = "https://mctl.ai"
SESSION_ORIGINS = "https://mctl.ai"
AUTH_FLOW_PUBLIC = "false"
# Fail closed until the dedicated customer-lifecycle service/project IDs from
# zitadel-iac are reviewed and pinned here. These are public identifiers.
SESSION_REVOCATION_SUBJECT = "395567307109172949"
SESSION_REVOCATION_AUDIENCE = "395567303451739861"

# Server-side sessions. The namespaces are owned by OpenTofu in mctl-gitops
# (infrastructure/cloudflare/account/workers-kv.tf, mctlhq/mctl-gitops#1909);
# this file only binds them.
[[kv_namespaces]]
binding = "SESSIONS"
id = "a42b3ef582994c48a87f14d9d8701379"

# `wrangler dev --env dev`: the mctl-web-dev client and a namespace of its own,
# so a local run can never read or write a production session. [vars] and
# bindings are not inherited by an environment, hence the full list.
[env.dev.vars]
UNLIMITED_USERS = "mashkovd"
ZITADEL_ISSUER = "https://auth.mctl.ai"
ZITADEL_CLIENT_ID = "395272531977701077"
ZITADEL_ORG_ID = "395272528420931285"
ZITADEL_GITHUB_IDP_ID = "395272531877168853"
ZITADEL_REDIRECT_URI = "http://localhost:8787/api/zitadel/callback"
ZITADEL_POST_LOGOUT_URI = "http://localhost:8787"
SESSION_ORIGINS = "http://localhost:3000"
AUTH_FLOW_PUBLIC = "false"

[[env.dev.kv_namespaces]]
binding = "SESSIONS"
id = "078d270d14204f75be694fcbecb1c12a"
