name: Build and Push
on:
  push:
    branches: [main]
    paths: ['static/**', 'Dockerfile', '.github/workflows/deploy.yml']
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dmitriimashkov/mctl-landing
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{github.actor}}', password: '${{secrets.GITHUB_TOKEN}}'}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dmitriimashkov/mctl-landing
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: '${{steps.meta.outputs.tags}}', no-cache: true}
