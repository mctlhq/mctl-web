name = "mctl-landing-form"
main = "index.js"
compatibility_date = "2024-01-01"

# Org-specific configuration — fork-friendly, change these for your deployment.
# Can also be overridden via Cloudflare dashboard environment variables.
[vars]
BASE_DOMAIN = "mctl.ai"
GITHUB_ORG = "mctlhq"
BACKSTAGE_APP_URL = "https://app.mctl.ai"
# Comma-separated GitHub usernames exempt from tenant-exists check
UNLIMITED_USERS = ""

# Secrets (set via `wrangler secret put` — never commit these)
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GITHUB_CLIENT_ID,
# GITHUB_CLIENT_SECRET, GITHUB_OAUTH_HMAC_KEY, BACKSTAGE_LANDING_TOKEN, RESEND_API_KEY

# Routes:
#   mctl.ai/api/*      — primary API endpoint
#   mctl.me/*          — redirect root domain to mctl.ai
#   *.mctl.me/*        — redirect subdomains to *.mctl.ai
#   mctl.ru/*          — redirect root domain to mctl.ai
#   *.mctl.ru/*        — redirect subdomains to *.mctl.ai
routes = [
  { pattern = "mctl.ai/api/*",  zone_name = "mctl.ai" },
  { pattern = "mctl.me/*",      zone_name = "mctl.me" },
  { pattern = "*.mctl.me/*",    zone_name = "mctl.me" },
  { pattern = "mctl.ru/*",      zone_name = "mctl.ru" },
  { pattern = "*.mctl.ru/*",    zone_name = "mctl.ru" }
]
