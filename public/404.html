<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — MCTL</title>
    <link rel="icon" type="image/svg+xml" href="https://ui.mctl.ai/brand/favicon-web.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://ui.mctl.ai" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link rel="stylesheet" href="https://ui.mctl.ai/mctl.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-sizing: border-box;
        background: var(--surface-bg, #12100f);
        color: var(--surface-fg, #f4f1ee);
        font-family: var(--font-display, system-ui, sans-serif);
        text-align: center;
      }
      .code {
        font-family: var(--font-mono, monospace);
        font-size: 0.875rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent, #c4694a);
        margin: 0 0 1rem;
      }
      h1 {
        font-family: var(--font-editorial, Georgia, serif);
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 400;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--surface-fg-muted, #b3aca6);
        margin: 0 0 2rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border: 1px solid var(--surface-line-strong, #4a4340);
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-weight: 500;
      }
      a:hover {
        border-color: var(--accent, #c4694a);
        color: var(--accent, #c4694a);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page does not exist</h1>
      <p>The link may be outdated, or the page may have moved.</p>
      <a href="/">Back to mctl.ai</a>
    </main>
  </body>
</html>
