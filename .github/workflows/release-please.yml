name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: deploy-mctl-web
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please has to open the release PR as somebody. The default
      # GITHUB_TOKEN cannot: "Allow GitHub Actions to create and approve pull
      # requests" is off at the org level, and on mctl-telegram every push to
      # main after 0.59.0 failed with "GitHub Actions is not permitted to
      # create or approve pull requests" until mctl-telegram#498 -- seven
      # releases' worth of commits with no release PR and nothing deployed.
      # This repo only kept working because a release PR was already open
      # (updating one is allowed; creating one is not). Minting a token from
      # the mctl-agents App (contents + pull-requests write on every mctlhq
      # repo) sidesteps the setting without turning it back on, and a PR
      # opened with an App token also raises pull_request events, so the
      # release PR gets normal CI instead of the default token's silent one.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-web
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Split from release-please so the dispatch key is only visible to this job
  # (mctlhq/mctl-gitops#1033). Runs on push to main only, which the main-only
  # `app-dispatch` environment requires. !cancelled() so a late failure in the
  # release step cannot skip the dispatch of a tag that was already created;
  # the outputs of the release step survive that failure.
  dispatch-release-deploy:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Main-only; holds DISPATCH_APP_PRIVATE_KEY (#1033).
    environment: app-dispatch
    permissions: {}
    steps:
      # mctl-gitops-dispatch can only dispatch workflows (actions:write +
      # metadata:read) and is installed on mctl-gitops alone. It replaces the
      # personal access token used before.
      - name: Generate dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops
          permission-actions: write

      # Note: `gh workflow run` is fire-and-forget: this step goes green once
      # the dispatch is accepted, not when release-deploy actually succeeds.
      # Watch the run in mctl-gitops Actions to confirm the build/bump landed.
      - name: Dispatch centralized release-deploy
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-web \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-web \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-web
