name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@0ca555be1bfadf79f76f2fd56a00e91b89806ffe
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot and mctl-agents are listed so their PRs get reviewed
      # automatically. Without the slug claude-code-action hard-fails with
      # "Workflow initiated by non-human actor", and since branch protection
      # requires an approving review, those PRs then sit unmergeable until a
      # maintainer triggers a review by hand. release-please.yml mints its
      # token from the AGENTS App, so every release PR here needs mctl-agents.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot,mctl-agents"
      conventions: |
        Follow the conventions in this repository's CLAUDE.md (TypeScript/
        Cloudflare Worker, conventional commits, English only, no emoji).

        Focus on:
        - Correctness and logic errors; edge cases the change misses.
        - Security: XSS, CSRF, OAuth token handling, secret leakage in
          client-side code or Worker responses.
        - Cloudflare Worker constraints: no Node.js APIs, CPU time limits,
          correct use of the Cache API and KV.
        - Error handling: ignored errors, missing fallbacks.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
